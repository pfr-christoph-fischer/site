<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Galeriebild 1 Platzhalter</title>
  <desc id="desc">Bearbeitbarer Platzhalter fuer das erste Galeriebild des Materials Schopfungsbuch.</desc>
  <rect width="1200" height="900" fill="#f4efe6" />
  <rect x="70" y="70" width="1060" height="760" rx="28" fill="#ffffff" stroke="#355070" stroke-width="8" />
  <text x="120" y="210" fill="#1f3b4d" font-family="'Atkinson Hyperlegible Next', sans-serif" font-size="64" font-weight="700">Galeriebild 1</text>
  <text x="120" y="300" fill="#1f3b4d" font-family="'Atkinson Hyperlegible Next', sans-serif" font-size="34">Diesen Platzhalter bearbeiten oder ersetzen.</text>
  <circle cx="900" cy="460" r="140" fill="#ffd166" />
  <rect x="180" y="520" width="320" height="140" rx="24" fill="#95d5b2" />
  <rect x="540" y="520" width="220" height="140" rx="24" fill="#a9def9" />
</svg>
