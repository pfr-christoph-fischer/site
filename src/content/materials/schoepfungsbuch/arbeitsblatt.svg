<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754" role="img" aria-labelledby="title desc">
  <title id="title">Arbeitsblatt Platzhalter fuer Schopfungsbuch</title>
  <desc id="desc">Bearbeitbarer Platzhalter fuer ein herunterladbares Arbeitsblatt.</desc>
  <rect width="1240" height="1754" fill="#ffffff" />
  <rect x="80" y="80" width="1080" height="1594" fill="#fffdf8" stroke="#1f3b4d" stroke-width="6" />
  <text x="130" y="200" fill="#1f3b4d" font-family="'Atkinson Hyperlegible Next', sans-serif" font-size="52" font-weight="700">Schopfungsbuch</text>
  <text x="130" y="280" fill="#1f3b4d" font-family="'Atkinson Hyperlegible Next', sans-serif" font-size="34">Arbeitsblatt Platzhalter</text>
  <text x="130" y="380" fill="#355070" font-family="'Atkinson Hyperlegible Next', sans-serif" font-size="26">Diese Datei kann durch ein echtes Arbeitsblatt ersetzt werden.</text>
  <line x1="130" y1="520" x2="1110" y2="520" stroke="#355070" stroke-width="4" />
  <line x1="130" y1="640" x2="1110" y2="640" stroke="#355070" stroke-width="4" />
  <line x1="130" y1="760" x2="1110" y2="760" stroke="#355070" stroke-width="4" />
  <line x1="130" y1="880" x2="1110" y2="880" stroke="#355070" stroke-width="4" />
</svg>
