items:
  "2019 Josefs Modenschau":
    description: Für den Religionsunterricht habe ich eine Reihe von Gewändern kreiert, die Josef in verschiedenen Stadien seiner Geschichte zeigen.
  "2021 Tauben zu Pfingsten":
    description: Zu Pfingsten 2021 haben ganz viele Menschen aus Tailfingen Tauben gefaltet, die sich dann als Schwarm vom Kreuz in der Peterskirche her ausbreiteten.
  "2021 Kreuzweg":
    description: Nach dem Erfolg von 2020 habe ich 2021 zum zweiten Mal einen Kreuzweg mit lokalen Künstler:innen initiiert. Leider ist dabei auch ein Bild Vandalismus zum Opfer gefallen. Das kaputte Kunstwerk von Andrea Simson habe ich sorgfältig restauriert. Mit seinen Rissen wurde es zu einem besonderen Sinnbild des Leidens Jesu.
  "2020 Tauben zu Pfingsten":
    description: Zu Pfingsten 2020 haben viele unterschiedliche Beteiligte mit von mir gefertigten Schablonen Tauben auf die Gehwege im Wohngebiet Langenwand gesprüht. Selbstverständlich kam dazu selbst hergestellte, umweltfreundliche und wasserlösliche Sprühkreide zum Einsatz.
  "2020 Kreuzweg":
    description: Mitten in der Coronazeit gestaltete ich gemeinsam mit Felix Sontheim einen Kreuzweg am Braunhardsberg. Die Bilder dazu trugen verschiedene Künstler:innen auf Tailfingen im Rahmen einer "Challenge" bei.
  "2020 Osterstrauß":
    description: Während der Ausgangssperre war die geöffnete Peterskirche einer der wenigen Orte, wohin Menschen in Tailfingen zu Gebet und Stille kommen konnten. Zu Ostern haben wir dort einen bunten Osterstrauß gestaltet, zu dem jeder etwas beitragen konnte.
  "2020 KonfiTüre":
    description: Aufgrund der Corona-Pandemie musste die Konfirmation 2020 auf unbestimmte Zeit verschoben werden. Als kleinen Trost bekamen meine Konfis eine ganz spezielle KONFItüre.
  "2019 Lichternacht":
    description: Bunte Lichtinstallation zur Illumination der Peterskirche bei der "Lichternacht" des Handels- und Gewerbevereins.
  "2019 Osterkerze":
    description: Als Symbol der Auferstehung habe ich aus den Trümmerstücken alter Kerzen eine neue Osterkerze für 2019 gegossen.
  "2014 Kunstausstellung":
    description: Mehrfach habe ich Ausstellungen organisiert, bei denen jeder aus der Gemeinde selbstgefertigte Kunst zur Schau stellen konnte.
  "2017 Ostergarten":
    description: Mehrere Jahre lang war ich Initiator und verantwortlicher Leiter des Ostergartens in Freudenstadt.
  "2023 Bibelhaus":
    description: Für meine biblischen Erzählfiguren, die ich in der Grundschule verwende, habe ich ein entsprechend großes Haus aus der Zeit Jesu nachgebaut.

